<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>薩摩川内市 看板デザイン図鑑</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #161719;
      font-family: 'Shippori Mincho', serif;
      user-select: none;
    }

    /* =========================================
       背景レイヤー（店舗に近づくとふんわり切り替わる）
    ========================================= */
    .bg-layer {
      position: fixed;
      inset: 0;
      background-size: cover;
      background-position: center;
      transition: opacity 1.1s cubic-bezier(0.22, 1, 0.36, 1), transform 1.6s ease;
      pointer-events: none;
      z-index: 0;
    }

    #bg-default {
      background-color: #1E2023;
      background-image: radial-gradient(rgba(255, 255, 255, 0.12) 1px, transparent 1px);
      background-size: 48px 48px;
      opacity: 1;
    }

    .shop-bg {
      opacity: 0;
      transform: scale(1.06);
      filter: brightness(0.72);
    }

    .shop-bg.is-active {
      opacity: 1;
      transform: scale(1);
    }

    /* =========================================
       左上のタイトル ＆ 現在のモード表示
    ========================================= */
    .site-title {
      position: fixed;
      top: 28px;
      left: 32px;
      z-index: 100;
      color: rgba(255, 255, 255, 0.92);
      font-size: 20px;
      letter-spacing: 0.14em;
      pointer-events: none;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.5);
    }

    .site-status {
      position: fixed;
      top: 62px;
      left: 32px;
      z-index: 100;
      color: rgba(255, 255, 255, 0.6);
      font-size: 12px;
      letter-spacing: 0.08em;
      pointer-events: none;
      transition: color 0.3s ease;
    }

    .site-status.is-reading {
      color: #E2A83E;
    }

    /* 画面中央の静かな目印 */
    .center-reticle {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 24px;
      height: 24px;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 50%;
      pointer-events: none;
      z-index: 90;
    }

    /* =========================================
       右下ミニマップ（6000×4500 空間の現在地レーダー）
    ========================================= */
    .minimap {
      position: fixed;
      bottom: 24px;
      right: 28px;
      width: 168px;
      height: 126px;
      background: rgba(18, 20, 23, 0.78);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      z-index: 100;
      pointer-events: none;
      overflow: hidden;
    }

    .minimap-view {
      position: absolute;
      border: 1px solid rgba(226, 168, 62, 0.85);
      background: rgba(226, 168, 62, 0.16);
    }

    .minimap-dot {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #FFF;
      transform: translate(-50%, -50%);
    }

    /* =========================================
       超広大な回遊空間（6000px × 4500px）
    ========================================= */
    #world {
      position: fixed;
      width: 6000px;
      height: 4500px;
      left: 0;
      top: 0;
      z-index: 10;
      will-change: transform;
    }

    /* =========================================
       店舗グループ ＆ 数珠繋ぎトピック展開
    ========================================= */
    .shop-spot {
      position: absolute;
      width: 0;
      height: 0;
    }

    /* 展開中のトピック群全体を包み込み、移動しても絶対に消えないようにする透明バリア */
    .juzu-safe-zone {
      position: absolute;
      left: 0;
      top: 0;
      width: 1350px;
      height: 920px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 5;
    }

    .shop-spot.is-active-shop .juzu-safe-zone {
      pointer-events: auto;
    }

    /* メインの店舗看板画像 */
    .main-sign-img {
      position: absolute;
      left: 0;
      top: 0;
      transform: translate(-50%, -50%);
      width: 300px;
      height: auto;
      cursor: pointer;
      z-index: 25;
      filter: drop-shadow(0 18px 36px rgba(0, 0, 0, 0.55));
      transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), filter 0.5s ease;
    }

    .shop-spot.is-active-shop .main-sign-img {
      transform: translate(-50%, -50%) scale(1.04);
      filter: drop-shadow(0 24px 48px rgba(0, 0, 0, 0.7));
    }

    /* 生徒制作の図鑑トピック画像（数珠繋ぎで1つずつ出現） */
    .topic-img {
      position: absolute;
      left: 0;
      top: 0;
      width: 275px;
      height: auto;
      pointer-events: none;
      z-index: 20;
      opacity: 0;
      cursor: pointer;
      transform: translate(calc(-50% + var(--from-x)), calc(-50% + var(--from-y))) scale(0.75);
      filter: drop-shadow(0 14px 28px rgba(0, 0, 0, 0.5));
      transition:
        transform 0.6s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.45s ease,
        filter 0.3s ease;
    }

    .topic-img.is-unlocked {
      opacity: 1;
      pointer-events: auto;
      transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1);
    }

    .topic-img.is-unlocked:hover {
      transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.22);
      z-index: 40;
      filter: drop-shadow(0 26px 52px rgba(0, 0, 0, 0.85));
    }
  </style>
</head>
<body>

  <div id="bg-default" class="bg-layer"></div>
  <div id="bg-container"></div>

  <h1 class="site-title">薩摩川内市 看板デザイン図鑑</h1>
  <div class="site-status" id="status-text">中心からカーソルを離すと回遊します（離れるほど加速）</div>
  <div class="center-reticle"></div>

  <div class="minimap" id="minimap">
    <div class="minimap-view" id="minimap-view"></div>
  </div>

  <div id="world"></div>

  <script>
    /**
     * =========================================================================
     * 【仮画像ジェネレーター】（本番画像ができたら "images/〇〇.png" に差し替え）
     * =========================================================================
     */
    function createDummySign(title, subtitle, bgColor, accentColor) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360">
        <rect x="16" y="16" width="568" height="328" rx="28" fill="${bgColor}" stroke="${accentColor}" stroke-width="6"/>
        <rect x="34" y="34" width="532" height="292" rx="18" fill="none" stroke="${accentColor}" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6"/>
        <text x="300" y="135" fill="${accentColor}" font-family="serif" font-size="22" letter-spacing="6" text-anchor="middle">${subtitle}</text>
        <text x="300" y="205" fill="#F7F5F0" font-family="serif" font-weight="bold" font-size="44" letter-spacing="4" text-anchor="middle">${title}</text>
        <text x="300" y="275" fill="#F7F5F0" opacity="0.6" font-family="sans-serif" font-size="16" text-anchor="middle">触れると画面中央へ移動し図鑑が開きます</text>
      </svg>`;
      return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
    }

    function createDummyTopic(num, heading, subtext, nextHint, badgeColor) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="540" height="350" viewBox="0 0 540 350">
        <rect x="8" y="8" width="524" height="334" rx="20" fill="#F7F5F0" stroke="#222" stroke-width="3"/>
        <rect x="28" y="28" width="104" height="32" rx="16" fill="${badgeColor}"/>
        <text x="80" y="49" fill="#FFF" font-family="sans-serif" font-weight="bold" font-size="15" text-anchor="middle">TOPIC ${num}</text>
        <text x="28" y="102" fill="#1E1E1E" font-family="serif" font-weight="bold" font-size="28">${heading}</text>
        <line x1="28" y1="122" x2="512" y2="122" stroke="#1E1E1E" stroke-width="2" opacity="0.2"/>
        <rect x="28" y="142" width="484" height="122" rx="12" fill="#EAE6DC"/>
        <text x="270" y="198" fill="#444" font-family="sans-serif" font-size="17" text-anchor="middle">${subtext}</text>
        <text x="270" y="226" fill="#777" font-family="sans-serif" font-size="13" text-anchor="middle">（カーソルを乗せると拡大してじっくり読めます）</text>
        <text x="508" y="312" fill="${badgeColor}" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="end">${nextHint}</text>
      </svg>`;
      return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
    }

    function createDummyBg(color1, color2, label) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
        <defs>
          <radialGradient id="g" cx="50%" cy="50%" r="70%">
            <stop offset="0%" stop-color="${color1}"/>
            <stop offset="100%" stop-color="${color2}"/>
          </radialGradient>
        </defs>
        <rect width="1600" height="900" fill="url(#g)"/>
        <circle cx="800" cy="450" r="380" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.08"/>
        <text x="800" y="840" fill="#FFFFFF" opacity="0.2" font-family="serif" font-size="22" letter-spacing="10" text-anchor="middle">${label}</text>
      </svg>`;
      return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
    }

    /**
     * =========================================================================
     * 【店舗データ】
     * =========================================================================
     */
    const shops = [
      {
        id: "ensemble",
        x: 3000,
        y: 2250,
        signImage: createDummySign("Ensemble", "DRINK × CAFE", "#2F3A40", "#E2A83E"),
        bgImage: createDummyBg("#4A3B32", "#1D1815", "BACKGROUND : ENSEMBLE CAFE ATMOSPHERE"),
        topics: [
          {
            image: createDummyTopic("01", "全体のまとまりの良さ", "文字の流れと全体のシルエット分析図", "触れると次のトピック02へ →", "#C83E2B"),
            offsetX: -340,
            offsetY: -180,
            width: 275
          },
          {
            image: createDummyTopic("02", "おさまりが生む愛おしさ", "曲線ラインと文字の止めの調和図解", "触れると次のトピック03へ →", "#D98A2B"),
            offsetX: 340,
            offsetY: -180,
            width: 275
          },
          {
            image: createDummyTopic("03", "かすかな安定感", "微妙に異なる文字間隔と密度の比較図", "触れると最後のトピック04へ →", "#2E6F73"),
            offsetX: 340,
            offsetY: 200,
            width: 275
          },
          {
            image: createDummyTopic("04", "入れ替えてみました（Ee / be）", "文字パーツ入れ替え検証シミュレーション", "★ すべてのトピックを展開しました", "#5D4E7B"),
            offsetX: -340,
            offsetY: 200,
            width: 275
          }
        ]
      },
      {
        id: "sample-shop-2",
        x: 4350,
        y: 1450,
        signImage: createDummySign("川内 昔ながらの和菓子舗", "TRADITIONAL SWEETS", "#4A2525", "#E8C574"),
        bgImage: createDummyBg("#522A28", "#1F1212", "BACKGROUND : RETRO SHOP STREET"),
        topics: [
          {
            image: createDummyTopic("01", "手書き毛筆の力強さ", "筆の入りと抜きのリズム分析", "触れるとトピック02へ →", "#C83E2B"),
            offsetX: -330,
            offsetY: -170,
            width: 270
          },
          {
            image: createDummyTopic("02", "経年変化と木の質感", "看板の素材と色味のコントラスト", "触れるとトピック03へ →", "#D98A2B"),
            offsetX: 330,
            offsetY: -170,
            width: 270
          },
          {
            image: createDummyTopic("03", "縦書きの余白バランス", "視線を誘導する文字配置の工夫", "★ すべてのトピックを展開しました", "#2E6F73"),
            offsetX: 330,
            offsetY: 190,
            width: 270
          }
        ]
      },
      {
        id: "sample-shop-3",
        x: 1650,
        y: 3050,
        signImage: createDummySign("せんだい 喫茶ロマン", "COFFEE & ROASTERY", "#263B36", "#9FD3C7"),
        bgImage: createDummyBg("#243B35", "#121D1A", "BACKGROUND : KISSATEN ROMAN"),
        topics: [
          {
            image: createDummyTopic("01", "昭和レトロな丸ゴシック", "角の丸みが生む親しみやすさ", "触れるとトピック02へ →", "#C83E2B"),
            offsetX: -330,
            offsetY: -170,
            width: 270
          },
          {
            image: createDummyTopic("02", "補色を使った配色設計", "深い緑とクリーム色のコントラスト", "★ すべてのトピックを展開しました", "#D98A2B"),
            offsetX: 330,
            offsetY: 180,
            width: 270
          }
        ]
      }
    ];

    /**
     * =========================================================================
     * 画面生成 ＆ 「中央オートセンタリング ＋ 数珠繋ぎ展開」制御
     * =========================================================================
     */
    const world = document.getElementById('world');
    const bgContainer = document.getElementById('bg-container');
    const minimap = document.getElementById('minimap');
    const minimapView = document.getElementById('minimap-view');
    const statusText = document.getElementById('status-text');

    const WORLD_W = 6000;
    const WORLD_H = 4500;
    let readingItem = null; // 閲覧中の店舗オブジェクト（{ shop, spot, bgDiv }）
    let isCenteringTransition = false; // 中央へスライド移動中の誤判定防止フラグ
    let centeringTimer = null;

    const shopElements = shops.map(shop => {
      // 1. 背景画像レイヤー
      const bgDiv = document.createElement('div');
      bgDiv.className = 'bg-layer shop-bg';
      bgDiv.style.backgroundImage = `url("${shop.bgImage}")`;
      bgContainer.appendChild(bgDiv);

      // ミニマップ上の店舗ドット
      const dot = document.createElement('div');
      dot.className = 'minimap-dot';
      dot.style.left = `${(shop.x / WORLD_W) * 100}%`;
      dot.style.top = `${(shop.y / WORLD_H) * 100}%`;
      minimap.appendChild(dot);

      // 2. 店舗スポット
      const spot = document.createElement('div');
      spot.className = 'shop-spot';
      spot.style.left = `${shop.x}px`;
      spot.style.top = `${shop.y}px`;

      // 閲覧中にトピック間を行き来しても絶対に消えないように守る大きな透明エリア
      const safeZone = document.createElement('div');
      safeZone.className = 'juzu-safe-zone';
      spot.appendChild(safeZone);

      // 3. 数珠繋ぎトピック群を生成
      const topicNodes = [];
      shop.topics.forEach((topic, index) => {
        const tImg = document.createElement('img');
        tImg.className = 'topic-img';
        tImg.src = topic.image;
        tImg.alt = '';
        if (topic.width) tImg.style.width = `${topic.width}px`;

        const prevTopic = index > 0 ? shop.topics[index - 1] : { offsetX: 0, offsetY: 0 };
        tImg.style.setProperty('--from-x', `${prevTopic.offsetX}px`);
        tImg.style.setProperty('--from-y', `${prevTopic.offsetY}px`);
        tImg.style.setProperty('--tx', `${topic.offsetX}px`);
        tImg.style.setProperty('--ty', `${topic.offsetY}px`);

        // 数珠繋ぎトリガー：このトピックにカーソルを合わせて閲覧すると、次のトピックが解放される
        tImg.addEventListener('mouseenter', () => {
          if (index + 1 < topicNodes.length) {
            topicNodes[index + 1].classList.add('is-unlocked');
          }
        });

        spot.appendChild(tImg);
        topicNodes.push(tImg);
      });

      // 4. メインの店舗看板画像
      const signImg = document.createElement('img');
      signImg.className = 'main-sign-img';
      signImg.src = shop.signImage;
      signImg.alt = '';
      spot.appendChild(signImg);

      const itemObj = { shop, spot, bgDiv };

      // ★ 看板に触れたら、その店舗を「画面の中央（特等席）」へ滑らかにスライド移動させつつ図鑑を開く！
      signImg.addEventListener('mouseenter', () => {
        spot.classList.add('is-active-shop');
        readingItem = itemObj;
        statusText.textContent = "図鑑を閲覧中（画面中央でじっくり閲覧できます・枠外に出ると回遊再開）";
        statusText.classList.add('is-reading');

        // 中央へスライド移動する最初の0.65秒間は、移動によるカーソル外れで閉じないように保護
        isCenteringTransition = true;
        clearTimeout(centeringTimer);
        centeringTimer = setTimeout(() => {
          isCenteringTransition = false;
        }, 650);

        if (topicNodes.length > 0) {
          topicNodes[0].classList.add('is-unlocked');
        }
      });

      // 店舗の大きな安全エリア（safeZone）から完全に外へ出たときだけ閉じる
      spot.addEventListener('mouseleave', () => {
        // 中央へスライド移動している最中の自動離脱は無視する
        if (isCenteringTransition) return;

        spot.classList.remove('is-active-shop');
        topicNodes.forEach(img => img.classList.remove('is-unlocked'));

        if (readingItem === itemObj) {
          readingItem = null;
          statusText.textContent = "中心からカーソルを離すと回遊します（離れるほど加速）";
          statusText.classList.remove('is-reading');
        }
      });

      world.appendChild(spot);
      return itemObj;
    });

    /**
     * =========================================================================
     * 中心基準・距離比例の滑らかな回遊スクロール ＋ 特等席オートセンタリング
     * =========================================================================
     */
    let currentX = window.innerWidth / 2 - 3000;
    let currentY = window.innerHeight / 2 - 2250;

    let pointerClientX = window.innerWidth / 2;
    let pointerClientY = window.innerHeight / 2;
    let hasMovedMouse = false;

    window.addEventListener('mousemove', (e) => {
      pointerClientX = e.clientX;
      pointerClientY = e.clientY;
      hasMovedMouse = true;
    });

    function animate() {
      const winW = window.innerWidth;
      const winH = window.innerHeight;
      const minX = Math.min(0, winW - WORLD_W);
      const minY = Math.min(0, winH - WORLD_H);

      if (readingItem) {
        // ★ 閲覧モード中：触れられた店舗が「画面のちょうど真ん中」に来るように滑らかに移動してピタッと止まる！
        const targetCenterX = Math.max(minX, Math.min(0, winW / 2 - readingItem.shop.x));
        const targetCenterY = Math.max(minY, Math.min(0, winH / 2 - readingItem.shop.y));

        currentX += (targetCenterX - currentX) * 0.08;
        currentY += (targetCenterY - currentY) * 0.08;
      } else if (hasMovedMouse) {
        // ★ 回遊モード中：中心からカーソルを離すほどゆっくり〜滑らかに加速
        const dxRatio = (pointerClientX - winW / 2) / (winW / 2);
        const dyRatio = (pointerClientY - winH / 2) / (winH / 2);

        const CENTER_DEAD_ZONE = 0.16;
        const MAX_SPEED = 6.5;

        let vx = 0;
        let vy = 0;

        if (Math.abs(dxRatio) > CENTER_DEAD_ZONE) {
          const normalized = (Math.abs(dxRatio) - CENTER_DEAD_ZONE) / (1 - CENTER_DEAD_ZONE);
          vx = -Math.sign(dxRatio) * Math.pow(normalized, 2.0) * MAX_SPEED;
        }

        if (Math.abs(dyRatio) > CENTER_DEAD_ZONE) {
          const normalized = (Math.abs(dyRatio) - CENTER_DEAD_ZONE) / (1 - CENTER_DEAD_ZONE);
          vy = -Math.sign(dyRatio) * Math.pow(normalized, 2.0) * MAX_SPEED;
        }

        currentX += vx;
        currentY += vy;

        currentX = Math.max(minX, Math.min(0, currentX));
        currentY = Math.max(minY, Math.min(0, currentY));
      }

      world.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;

      // ミニマップの現在地枠を更新
      minimapView.style.left = `${(-currentX / WORLD_W) * 100}%`;
      minimapView.style.top = `${(-currentY / WORLD_H) * 100}%`;
      minimapView.style.width = `${(winW / WORLD_W) * 100}%`;
      minimapView.style.height = `${(winH / WORLD_H) * 100}%`;

      // 店舗への接近判定（620px以内に近づくと背景がふんわり切り替わる）
      const APPROACH_RADIUS = 620;
      let closestItem = null;
      let minDistance = Infinity;

      shopElements.forEach(item => {
        const screenShopX = currentX + item.shop.x;
        const screenShopY = currentY + item.shop.y;
        const dist = Math.hypot(pointerClientX - screenShopX, pointerClientY - screenShopY);

        if (dist < APPROACH_RADIUS && dist < minDistance) {
          minDistance = dist;
          closestItem = item;
        }
      });

      shopElements.forEach(item => {
        if (item === closestItem || item === readingItem) {
          item.bgDiv.classList.add('is-active');
        } else {
          item.bgDiv.classList.remove('is-active');
        }
      });

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
