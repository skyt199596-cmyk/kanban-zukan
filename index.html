<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>薩摩川内市 看板デザイン図鑑</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #18191b;
      font-family: 'Shippori Mincho', serif;
      user-select: none;
    }

    /* =========================================
       背景レイヤー（店舗に近づくとふんわり切り替わる）
    ========================================= */
    .bg-layer {
      position: fixed;
      inset: 0;
      background-size: cover;
      background-position: center;
      transition: opacity 1.1s cubic-bezier(0.22, 1, 0.36, 1), transform 1.6s ease;
      pointer-events: none;
      z-index: 0;
    }

    #bg-default {
      background-color: #202225;
      background-image: radial-gradient(rgba(255, 255, 255, 0.12) 1px, transparent 1px);
      background-size: 44px 44px;
      opacity: 1;
    }

    .shop-bg {
      opacity: 0;
      transform: scale(1.05);
      filter: brightness(0.72);
    }

    .shop-bg.is-active {
      opacity: 1;
      transform: scale(1);
    }

    /* =========================================
       左上のタイトルロゴ
    ========================================= */
    .site-title {
      position: fixed;
      top: 28px;
      left: 32px;
      z-index: 100;
      color: rgba(255, 255, 255, 0.9);
      font-size: 20px;
      letter-spacing: 0.14em;
      pointer-events: none;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.5);
    }

    .site-status {
      position: fixed;
      top: 62px;
      left: 32px;
      z-index: 100;
      color: rgba(255, 255, 255, 0.55);
      font-size: 12px;
      letter-spacing: 0.08em;
      pointer-events: none;
      transition: color 0.3s ease;
    }

    .site-status.is-locked {
      color: #E2A83E;
    }

    /* =========================================
       右下ミニマップ（広大な空間の現在地レーダー）
    ========================================= */
    .minimap {
      position: fixed;
      bottom: 24px;
      right: 28px;
      width: 160px;
      height: 120px;
      background: rgba(20, 22, 25, 0.72);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      z-index: 100;
      pointer-events: none;
      overflow: hidden;
    }

    .minimap-view {
      position: absolute;
      border: 1px solid rgba(226, 168, 62, 0.8);
      background: rgba(226, 168, 62, 0.15);
    }

    .minimap-dot {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #FFF;
      transform: translate(-50%, -50%);
    }

    /* =========================================
       広大な回遊空間（4800px × 3600px）
    ========================================= */
    #world {
      position: fixed;
      width: 4800px;
      height: 3600px;
      left: 0;
      top: 0;
      z-index: 10;
      will-change: transform;
    }

    /* =========================================
       店舗グループ
    ========================================= */
    .shop-spot {
      position: absolute;
      width: 0;
      height: 0;
    }

    /* 展開後にトピック全体を包み込む透明の維持エリア（これがあることでトピックを見に行っても閉じない） */
    .hover-keep-zone {
      position: absolute;
      left: 0;
      top: 0;
      width: 980px;
      height: 760px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 5;
    }

    .shop-spot.is-hovered .hover-keep-zone {
      pointer-events: auto;
    }

    /* メインの店舗看板画像 */
    .main-sign-img {
      position: absolute;
      left: 0;
      top: 0;
      transform: translate(-50%, -50%);
      width: 300px;
      height: auto;
      cursor: pointer;
      z-index: 20;
      filter: drop-shadow(0 18px 36px rgba(0, 0, 0, 0.5));
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1), filter 0.55s ease;
    }

    .shop-spot.is-hovered .main-sign-img {
      transform: translate(-50%, -50%) scale(1.04);
      filter: drop-shadow(0 26px 50px rgba(0, 0, 0, 0.65));
    }

    /* =========================================
       生徒制作の図鑑トピック画像（時間差で連続ポップアップ）
    ========================================= */
    .topic-img {
      position: absolute;
      left: 0;
      top: 0;
      width: 265px;
      height: auto;
      pointer-events: none;
      z-index: 15;
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.75);
      filter: drop-shadow(0 14px 28px rgba(0, 0, 0, 0.45));
      transition:
        transform 0.65s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.45s ease;
    }

    .shop-spot.is-hovered .topic-img {
      opacity: 1;
      pointer-events: auto;
      transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1);
    }

    /* 個別のトピック画像にカーソルを合わせるとさらに大きく拡大してじっくり読める */
    .shop-spot.is-hovered .topic-img:hover {
      transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.18);
      z-index: 35;
      filter: drop-shadow(0 24px 48px rgba(0, 0, 0, 0.75));
    }
  </style>
</head>
<body>

  <div id="bg-default" class="bg-layer"></div>
  <div id="bg-container"></div>

  <h1 class="site-title">薩摩川内市 看板デザイン図鑑</h1>
  <div class="site-status" id="status-text">画面の端にカーソルを寄せるとゆっくり回遊します</div>

  <!-- 右下ミニマップ -->
  <div class="minimap" id="minimap">
    <div class="minimap-view" id="minimap-view"></div>
  </div>

  <!-- 4800x3600 の広大な空間 -->
  <div id="world"></div>

  <script>
    /**
     * =========================================================================
     * 【仮画像ジェネレーター】（本番画像ができたら "images/〇〇.png" に差し替え）
     * =========================================================================
     */
    function createDummySign(title, subtitle, bgColor, accentColor) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360">
        <rect x="16" y="16" width="568" height="328" rx="28" fill="${bgColor}" stroke="${accentColor}" stroke-width="6"/>
        <rect x="34" y="34" width="532" height="292" rx="18" fill="none" stroke="${accentColor}" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6"/>
        <text x="300" y="135" fill="${accentColor}" font-family="serif" font-size="22" letter-spacing="6" text-anchor="middle">${subtitle}</text>
        <text x="300" y="205" fill="#F7F5F0" font-family="serif" font-weight="bold" font-size="44" letter-spacing="4" text-anchor="middle">${title}</text>
        <text x="300" y="275" fill="#F7F5F0" opacity="0.55" font-family="sans-serif" font-size="16" text-anchor="middle">カーソルを合わせると図鑑が開きます</text>
      </svg>`;
      return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
    }

    function createDummyTopic(num, heading, subtext, badgeColor) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="520" height="340" viewBox="0 0 520 340">
        <rect x="8" y="8" width="504" height="324" rx="20" fill="#F7F5F0" stroke="#222" stroke-width="3"/>
        <rect x="28" y="28" width="96" height="32" rx="16" fill="${badgeColor}"/>
        <text x="76" y="49" fill="#FFF" font-family="sans-serif" font-weight="bold" font-size="15" text-anchor="middle">TOPIC ${num}</text>
        <text x="28" y="102" fill="#1E1E1E" font-family="serif" font-weight="bold" font-size="28">${heading}</text>
        <line x1="28" y1="122" x2="492" y2="122" stroke="#1E1E1E" stroke-width="2" opacity="0.2"/>
        <rect x="28" y="142" width="464" height="120" rx="12" fill="#EAE6DC"/>
        <text x="260" y="198" fill="#555" font-family="sans-serif" font-size="17" text-anchor="middle">${subtext}</text>
        <text x="260" y="226" fill="#888" font-family="sans-serif" font-size="13" text-anchor="middle">（カーソルを乗せるとさらに拡大して読めます）</text>
        <text x="488" y="308" fill="#888" font-family="sans-serif" font-size="13" text-anchor="end">SATSUMASENDAI ARCHIVE</text>
      </svg>`;
      return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
    }

    function createDummyBg(color1, color2, label) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
        <defs>
          <radialGradient id="g" cx="50%" cy="50%" r="70%">
            <stop offset="0%" stop-color="${color1}"/>
            <stop offset="100%" stop-color="${color2}"/>
          </radialGradient>
        </defs>
        <rect width="1600" height="900" fill="url(#g)"/>
        <circle cx="800" cy="450" r="380" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.08"/>
        <text x="800" y="840" fill="#FFFFFF" opacity="0.2" font-family="serif" font-size="22" letter-spacing="10" text-anchor="middle">${label}</text>
      </svg>`;
      return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
    }

    /**
     * =========================================================================
     * 【店舗データ】広い空間（4800 × 3600）の中にゆったり配置
     * =========================================================================
     */
    const shops = [
      {
        id: "ensemble",
        // 空間の中央付近（2400, 1800）
        x: 2400,
        y: 1800,
        signImage: createDummySign("Ensemble", "DRINK × CAFE", "#2F3A40", "#E2A83E"),
        bgImage: createDummyBg("#4A3B32", "#1D1815", "BACKGROUND : ENSEMBLE CAFE ATMOSPHERE"),
        topics: [
          {
            image: createDummyTopic("01", "全体のまとまりの良さ", "文字の流れと全体のシルエット分析図", "#C83E2B"),
            offsetX: -340,
            offsetY: -200,
            width: 265
          },
          {
            image: createDummyTopic("02", "おさまりが生む愛おしさ", "曲線ラインと文字の止めの調和図解", "#D98A2B"),
            offsetX: 340,
            offsetY: -190,
            width: 265
          },
          {
            image: createDummyTopic("03", "かすかな安定感", "微妙に異なる文字間隔と密度の比較図", "#2E6F73"),
            offsetX: -330,
            offsetY: 210,
            width: 265
          },
          {
            image: createDummyTopic("04", "入れ替えてみました（Ee / be）", "文字パーツ入れ替え検証シミュレーション", "#5D4E7B"),
            offsetX: 330,
            offsetY: 220,
            width: 265
          }
        ]
      },
      {
        id: "sample-shop-2",
        // 右上のエリアへゆったり離して配置
        x: 3450,
        y: 1250,
        signImage: createDummySign("川内 昔ながらの和菓子舗", "TRADITIONAL SWEETS", "#4A2525", "#E8C574"),
        bgImage: createDummyBg("#522A28", "#1F1212", "BACKGROUND : RETRO SHOP STREET"),
        topics: [
          {
            image: createDummyTopic("01", "手書き毛筆の力強さ", "筆の入りと抜きのリズム分析", "#C83E2B"),
            offsetX: -330,
            offsetY: -190,
            width: 260
          },
          {
            image: createDummyTopic("02", "経年変化と木の質感", "看板の素材と色味のコントラスト", "#D98A2B"),
            offsetX: 330,
            offsetY: -180,
            width: 260
          },
          {
            image: createDummyTopic("03", "縦書きの余白バランス", "視線を誘導する文字配置の工夫", "#2E6F73"),
            offsetX: 320,
            offsetY: 200,
            width: 260
          }
        ]
      },
      {
        id: "sample-shop-3",
        // 左下のエリアへゆったり離して配置
        x: 1350,
        y: 2350,
        signImage: createDummySign("せんだい 喫茶ロマン", "COFFEE & ROASTERY", "#263B36", "#9FD3C7"),
        bgImage: createDummyBg("#243B35", "#121D1A", "BACKGROUND : KISSATEN ROMAN"),
        topics: [
          {
            image: createDummyTopic("01", "昭和レトロな丸ゴシック", "角の丸みが生む親しみやすさ", "#C83E2B"),
            offsetX: -320,
            offsetY: -180,
            width: 260
          },
          {
            image: createDummyTopic("02", "補色を使った配色設計", "深い緑とクリーム色のコントラスト", "#D98A2B"),
            offsetX: 320,
            offsetY: 190,
            width: 260
          }
        ]
      }
    ];

    /**
     * =========================================================================
     * 画面生成と「じっくり閲覧できる」インタラクション制御
     * =========================================================================
     */
    const world = document.getElementById('world');
    const bgContainer = document.getElementById('bg-container');
    const minimap = document.getElementById('minimap');
    const minimapView = document.getElementById('minimap-view');
    const statusText = document.getElementById('status-text');

    const WORLD_W = 4800;
    const WORLD_H = 3600;
    let activeSpot = null; // 現在図鑑を開いている店舗（開いている間はカメラを自動ロック）

    const shopElements = shops.map(shop => {
      // 1. 背景画像レイヤー
      const bgDiv = document.createElement('div');
      bgDiv.className = 'bg-layer shop-bg';
      bgDiv.style.backgroundImage = `url("${shop.bgImage}")`;
      bgContainer.appendChild(bgDiv);

      // ミニマップ上の店舗ドット
      const dot = document.createElement('div');
      dot.className = 'minimap-dot';
      dot.style.left = `${(shop.x / WORLD_W) * 100}%`;
      dot.style.top = `${(shop.y / WORLD_H) * 100}%`;
      minimap.appendChild(dot);

      // 2. 店舗スポット
      const spot = document.createElement('div');
      spot.className = 'shop-spot';
      spot.style.left = `${shop.x}px`;
      spot.style.top = `${shop.y}px`;

      // 展開後にトピック間を移動しても閉じないように守る透明バリア
      const keepZone = document.createElement('div');
      keepZone.className = 'hover-keep-zone';
      spot.appendChild(keepZone);

      // 3. 生徒制作のトピック画像（時間差で連続ポップアップ）
      shop.topics.forEach((topic, index) => {
        const tImg = document.createElement('img');
        tImg.className = 'topic-img';
        tImg.src = topic.image;
        tImg.alt = '';
        if (topic.width) tImg.style.width = `${topic.width}px`;
        tImg.style.setProperty('--tx', `${topic.offsetX}px`);
        tImg.style.setProperty('--ty', `${topic.offsetY}px`);
        tImg.dataset.delay = `${index * 0.14}s`;
        spot.appendChild(tImg);
      });

      // 4. 店舗看板画像（メイン）
      const signImg = document.createElement('img');
      signImg.className = 'main-sign-img';
      signImg.src = shop.signImage;
      signImg.alt = '';
      spot.appendChild(signImg);

      // 看板に触れたら図鑑を展開し、カメラのスクロールを一時停止してじっくり見られるようにする
      signImg.addEventListener('mouseenter', () => {
        spot.classList.add('is-hovered');
        activeSpot = spot;
        statusText.textContent = "図鑑を閲覧中（枠の外へカーソルを出すと再び回遊します）";
        statusText.classList.add('is-locked');

        spot.querySelectorAll('.topic-img').forEach(img => {
          img.style.transitionDelay = img.dataset.delay;
        });
      });

      // 店舗全体の大きなバリア（keepZone）から外に出たときだけ閉じる
      spot.addEventListener('mouseleave', () => {
        spot.classList.remove('is-hovered');
        if (activeSpot === spot) {
          activeSpot = null;
          statusText.textContent = "画面の端にカーソルを寄せるとゆっくり回遊します";
          statusText.classList.remove('is-locked');
        }
        spot.querySelectorAll('.topic-img').forEach(img => {
          img.style.transitionDelay = '0s';
        });
      });

      world.appendChild(spot);
      return { shop, spot, bgDiv };
    });

    /**
     * =========================================================================
     * 画面端ゾーン方式のゆっくり回遊スクロール
     * （中央70%では動かず、上下左右の端15%にカーソルを置いたときだけゆっくり進む）
     * =========================================================================
     */
    // 初期位置は中央の「Ensemble（2400, 1800）」が画面真ん中に来る位置
    let currentX = window.innerWidth / 2 - 2400;
    let currentY = window.innerHeight / 2 - 1800;

    let pointerClientX = window.innerWidth / 2;
    let pointerClientY = window.innerHeight / 2;
    let hasMovedMouse = false;

    window.addEventListener('mousemove', (e) => {
      pointerClientX = e.clientX;
      pointerClientY = e.clientY;
      hasMovedMouse = true;
    });

    function animate() {
      const winW = window.innerWidth;
      const winH = window.innerHeight;

      // 図鑑を開いて閲覧中（activeSpot !== null）は、画面が逃げないようにスクロールを一時停止！
      if (hasMovedMouse && !activeSpot) {
        // 画面上のカーソル位置を -1.0 〜 +1.0 に変換（中央が 0）
        const normX = (pointerClientX / winW - 0.5) * 2;
        const normY = (pointerClientY / winH - 0.5) * 2;

        // 中央70%（-0.7 〜 +0.7）は「静止ゾーン（デッドゾーン）」
        const DEAD_ZONE = 0.68;
        const MAX_SPEED = 5.5; // 最高速度をかなりゆっくりに設定（数値が小さいほど遅い）

        let vx = 0;
        let vy = 0;

        if (Math.abs(normX) > DEAD_ZONE) {
          const ratioX = (Math.abs(normX) - DEAD_ZONE) / (1 - DEAD_ZONE);
          vx = -Math.sign(normX) * Math.pow(ratioX, 1.5) * MAX_SPEED;
        }

        if (Math.abs(normY) > DEAD_ZONE) {
          const ratioY = (Math.abs(normY) - DEAD_ZONE) / (1 - DEAD_ZONE);
          vy = -Math.sign(normY) * Math.pow(ratioY, 1.5) * MAX_SPEED;
        }

        currentX += vx;
        currentY += vy;

        // 広い空間の外へ行き過ぎないように制限
        const minX = Math.min(0, winW - WORLD_W);
        const minY = Math.min(0, winH - WORLD_H);
        currentX = Math.max(minX, Math.min(0, currentX));
        currentY = Math.max(minY, Math.min(0, currentY));
      }

      world.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;

      // ミニマップの現在地枠を更新
      minimapView.style.left = `${(-currentX / WORLD_W) * 100}%`;
      minimapView.style.top = `${(-currentY / WORLD_H) * 100}%`;
      minimapView.style.width = `${(winW / WORLD_W) * 100}%`;
      minimapView.style.height = `${(winH / WORLD_H) * 100}%`;

      // 店舗への接近判定（560px以内に近づくと背景がふんわり切り替わる）
      const APPROACH_RADIUS = 560;
      let closestItem = null;
      let minDistance = Infinity;

      shopElements.forEach(item => {
        const screenShopX = currentX + item.shop.x;
        const screenShopY = currentY + item.shop.y;
        const dist = Math.hypot(pointerClientX - screenShopX, pointerClientY - screenShopY);

        if (dist < APPROACH_RADIUS && dist < minDistance) {
          minDistance = dist;
          closestItem = item;
        }
      });

      shopElements.forEach(item => {
        if (item === closestItem || item.spot === activeSpot) {
          item.bgDiv.classList.add('is-active');
        } else {
          item.bgDiv.classList.remove('is-active');
        }
      });

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
