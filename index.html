<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>薩摩川内市 看板デザイン図鑑</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@600;700;800&display=swap" rel="stylesheet">
  
  <!-- Panzoom CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>

  <style>
    :root {
      --bg-paper: #F3EFE6;       /* 温かみのある生成り色の紙面 */
      --ink-dark: #232220;       /* 墨色 */
      --ink-muted: #66635E;
      --accent-red: #C83E2B;     /* 朱色（赤ペンチェック風） */
      --accent-gold: #D99B26;    /* マスタード */
      --card-white: #FFFFFF;
      --shadow-pin: 0 14px 30px rgba(35, 34, 32, 0.14);
      --shadow-hover: 0 22px 45px rgba(35, 34, 32, 0.22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-paper);
      color: var(--ink-dark);
      font-family: 'Noto Sans JP', sans-serif;
      user-select: none;
    }

    /* =========================================
       左上の雑誌タイトルロゴ
    ========================================= */
    .editorial-header {
      position: fixed;
      top: 24px;
      left: 28px;
      z-index: 100;
      pointer-events: none;
    }

    .editorial-kicker {
      font-family: 'Fraunces', serif;
      font-size: 11px;
      letter-spacing: 0.16em;
      color: var(--accent-red);
      font-weight: 700;
      margin-bottom: 4px;
    }

    .editorial-title {
      font-family: 'Shippori Mincho', serif;
      font-size: clamp(22px, 2.6vw, 30px);
      font-weight: 800;
      color: var(--ink-dark);
      letter-spacing: 0.05em;
    }

    .editorial-sub {
      font-size: 12px;
      color: var(--ink-muted);
      margin-top: 4px;
    }

    /* 右上の操作ヒント */
    .hint-badge {
      position: fixed;
      top: 24px;
      right: 28px;
      z-index: 100;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(35, 34, 32, 0.12);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 12px;
      color: var(--ink-dark);
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
      pointer-events: none;
    }

    @media (max-width: 768px) {
      .hint-badge { display: none; }
      .editorial-header { top: 16px; left: 16px; }
    }

    /* =========================================
       自由移動・拡大縮小できるホワイトボード空間
    ========================================= */
    #viewport {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
    }

    #viewport:active { cursor: grabbing; }

    #canvas-world {
      width: 3200px;
      height: 3200px;
      position: relative;
      background-color: var(--bg-paper);
      /* 方眼ノート風の淡いグリッド */
      background-image:
        linear-gradient(to right, rgba(35, 34, 32, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(35, 34, 32, 0.05) 1px, transparent 1px);
      background-size: 48px 48px;
      transform-origin: 0 0;
    }

    /* =========================================
       店舗クラスター（空間にピン留めされた看板）
    ========================================= */
    .shop-node {
      position: absolute;
      width: 0;
      height: 0;
      transition: opacity 0.3s ease;
    }

    .shop-node.is-filtered-out {
      opacity: 0.12;
      pointer-events: none;
    }

    .shop-node.is-open {
      z-index: 50;
    }

    /* 手書き風の枝分かれ線（SVG） */
    .connector-svg {
      position: absolute;
      left: -600px;
      top: -500px;
      width: 1200px;
      height: 1000px;
      pointer-events: none;
      overflow: visible;
      z-index: 1;
    }

    .connector-line {
      fill: none;
      stroke: var(--accent-red);
      stroke-width: 2;
      stroke-dasharray: 6 6;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .shop-node.is-open .connector-line {
      opacity: 0.75;
    }

    /* =========================================
       親アイテム：ポラロイド写真風の看板カード
       （四角い重い枠をなくし、写真の形をそのまま活かす）
    ========================================= */
    .signboard-pin {
      position: absolute;
      left: 0;
      top: 0;
      transform: translate(-50%, -50%) rotate(-1deg);
      background: var(--card-white);
      padding: 14px 14px 18px 14px;
      border-radius: 4px;
      box-shadow: var(--shadow-pin);
      cursor: pointer;
      z-index: 10;
      width: 310px;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s ease;
    }

    /* 上部のマスキングテープ風アクセント */
    .signboard-pin::before {
      content: '';
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%) rotate(1.5deg);
      width: 84px;
      height: 22px;
      background: rgba(217, 155, 38, 0.45);
      backdrop-filter: blur(2px);
    }

    .shop-node.is-open .signboard-pin,
    .signboard-pin:hover {
      transform: translate(-50%, -50%) rotate(0deg) scale(1.04);
      box-shadow: var(--shadow-hover);
    }

    .photo-box {
      width: 100%;
      min-height: 170px;
      max-height: 240px;
      background: #E7E2D8;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-box img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain; /* 写真を切り抜かず全体を綺麗に見せる */
    }

    .photo-placeholder {
      padding: 28px 16px;
      text-align: center;
      color: var(--ink-muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .pin-caption {
      margin-top: 12px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 8px;
    }

    .pin-category {
      font-size: 10px;
      font-weight: 700;
      color: var(--accent-red);
      letter-spacing: 0.08em;
    }

    .pin-title {
      font-family: 'Shippori Mincho', serif;
      font-size: 18px;
      font-weight: 800;
      color: var(--ink-dark);
      line-height: 1.3;
      margin-top: 2px;
    }

    .pin-toggle-badge {
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 700;
      background: var(--bg-paper);
      color: var(--ink-dark);
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid rgba(35, 34, 32, 0.15);
      transition: all 0.25s ease;
    }

    .shop-node.is-open .pin-toggle-badge {
      background: var(--accent-red);
      color: #FFF;
      border-color: var(--accent-red);
    }

    /* =========================================
       子アイテム：周囲にふわっと広がる付箋・観察メモ
    ========================================= */
    .memo-leaf {
      position: absolute;
      left: 0;
      top: 0;
      width: 240px;
      background: var(--card-white);
      border-left: 4px solid var(--accent-red);
      border-radius: 6px;
      padding: 14px 16px;
      box-shadow: 0 10px 26px rgba(35, 34, 32, 0.14);
      z-index: 20;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0.6);
      transition:
        transform 0.5s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.35s ease,
        box-shadow 0.25s ease;
    }

    .shop-node.is-open .memo-leaf {
      opacity: 1;
      pointer-events: auto;
      transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1);
    }

    .shop-node.is-open .memo-leaf:hover {
      transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty) - 4px)) scale(1.03);
      box-shadow: 0 16px 34px rgba(35, 34, 32, 0.22);
      z-index: 35;
    }

    .memo-step {
      font-family: 'Fraunces', serif;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-red);
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }

    .memo-heading {
      font-family: 'Shippori Mincho', serif;
      font-size: 15px;
      font-weight: 800;
      color: var(--ink-dark);
      margin-bottom: 6px;
      line-height: 1.35;
    }

    .memo-excerpt {
      font-size: 12px;
      color: var(--ink-muted);
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .memo-readmore {
      margin-top: 8px;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-red);
      text-align: right;
    }

    /* =========================================
       下部コントロールバー
    ========================================= */
    .bottom-bar {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 120;
      background: rgba(35, 34, 32, 0.92);
      backdrop-filter: blur(10px);
      padding: 7px 12px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.22);
      max-width: 94vw;
      overflow-x: auto;
    }

    .filter-btn {
      background: transparent;
      border: none;
      color: #D6D2C9;
      font-size: 12px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .filter-btn:hover { color: #FFF; }
    .filter-btn.active {
      background: var(--accent-gold);
      color: var(--ink-dark);
    }

    .bar-sep {
      width: 1px;
      height: 18px;
      background: rgba(255, 255, 255, 0.2);
      margin: 0 4px;
    }

    .reset-btn {
      background: #FFF;
      color: var(--ink-dark);
      border: none;
      font-size: 12px;
      font-weight: 700;
      padding: 7px 14px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
    }

    .reset-btn:hover {
      background: var(--accent-red);
      color: #FFF;
    }

    /* =========================================
       雑誌の1ページ風 詳細モーダル
    ========================================= */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(35, 34, 32, 0.65);
      backdrop-filter: blur(5px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s ease;
    }

    .modal-overlay.is-open {
      opacity: 1;
      visibility: visible;
    }

    .magazine-sheet {
      background: var(--bg-paper);
      width: 100%;
      max-width: 780px;
      max-height: 86vh;
      border-radius: 12px;
      overflow-y: auto;
      padding: 32px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      position: relative;
      border: 1px solid rgba(35, 34, 32, 0.15);
    }

    .close-sheet-btn {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(35, 34, 32, 0.2);
      background: #FFF;
      font-size: 18px;
      cursor: pointer;
    }

    .sheet-shop-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-red);
      letter-spacing: 0.08em;
    }

    .sheet-title {
      font-family: 'Shippori Mincho', serif;
      font-size: 26px;
      font-weight: 800;
      margin: 6px 0 20px;
      padding-bottom: 14px;
      border-bottom: 2px solid var(--ink-dark);
    }

    .sheet-grid {
      display: grid;
      grid-template-columns: 1fr 1.1fr;
      gap: 24px;
      align-items: start;
    }

    @media (max-width: 680px) {
      .sheet-grid { grid-template-columns: 1fr; }
      .magazine-sheet { padding: 22px; }
    }

    .sheet-photo {
      background: #FFF;
      padding: 10px;
      border-radius: 6px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    }

    .sheet-photo img {
      width: 100%;
      height: auto;
      display: block;
    }

    .sheet-text {
      font-size: 15px;
      line-height: 1.9;
      color: var(--ink-dark);
      white-space: pre-line;
    }
  </style>
</head>
<body>

  <header class="editorial-header">
    <div class="editorial-kicker">SATSUMASENDAI SIGNAGE FIELD GUIDE</div>
    <h1 class="editorial-title">薩摩川内市 看板デザイン図鑑</h1>
    <p class="editorial-sub">看板にカーソルを合わせる（タップする）と観察メモが広がります</p>
  </header>

  <div class="hint-badge">ドラッグで移動 ／ ホイールで拡大縮小</div>

  <div id="viewport">
    <div id="canvas-world"></div>
  </div>

  <nav class="bottom-bar">
    <button class="filter-btn active" data-filter="all">すべて表示</button>
    <button class="filter-btn" data-filter="cafe">カフェ・飲食</button>
    <button class="filter-btn" data-filter="retro">レトロ・老舗</button>
    <div class="bar-sep"></div>
    <button class="reset-btn" id="btn-reset">全体へ戻る</button>
  </nav>

  <!-- 詳細解説モーダル -->
  <div class="modal-overlay" id="modal">
    <article class="magazine-sheet">
      <button class="close-sheet-btn" id="modal-close" aria-label="閉じる">×</button>
      <div class="sheet-shop-label" id="modal-shop">店舗名</div>
      <h2 class="sheet-title" id="modal-title">観察ポイント</h2>
      <div class="sheet-grid">
        <div class="sheet-photo" id="modal-photo-wrap"></div>
        <div class="sheet-text" id="modal-body">解説文</div>
      </div>
    </article>
  </div>

  <script>
    /**
     * =========================================================================
     * 【ここだけ編集すればOK】店舗データ一覧
     * Figmaは不要です。「看板の写真1枚」と「気づいたこと（文章）」だけを書いてください。
     * =========================================================================
     */
    const shopsData = [
      {
        id: "ensemble",
        name: "Drink×Caf'e Ensemble（あんさんぶる）",
        category: "cafe",
        categoryLabel: "カフェ・飲食",
        // ※パソコンの images フォルダに入っている実際の看板写真ファイル名に合わせてください
        photo: "images/en.png",
        x: 1600,
        y: 1600,
        notes: [
          {
            step: "POINT 01",
            title: "全体のまとまりの良さ",
            offsetX: -340,
            offsetY: -200,
            text: "一文字一文字の個性の強さをこんなにも自然にまとめあげているのは、おそらく文字の流れと全体のまとまった形の影響だと思います。"
          },
          {
            step: "POINT 02",
            title: "おさまりが生む愛おしさ",
            offsetX: 340,
            offsetY: -200,
            text: "曲線が生むしなやかなライン、文字の止めが作るみっちりとしたおさまりの良さ。それが看板の中に調和していると思います。"
          },
          {
            step: "POINT 03",
            title: "かすかな安定感",
            offsetX: -340,
            offsetY: 210,
            text: "一見同じ形に見えてもかすかに形が違うことで文字どうしの間など、バランスの良い密度が生まれていると思います。一見同じ穴の段に見えて実は微妙に違います。その違いが文字の印象に大きな影響を与えます。"
          },
          {
            step: "POINT 04",
            title: "入れ替えてみました（Ee / be）",
            offsetX: 340,
            offsetY: 210,
            text: "違いを感じてもらうために私が個人的に似ていると思った箇所を入れ替えてみました。入れ替えることで元のデザインのバランスの良さに気づけることが出来ました。"
          }
        ]
      }
    ];

    /**
     * =========================================================================
     * 画面の自動生成・動きの制御（ここは触らなくて大丈夫です）
     * =========================================================================
     */
    const world = document.getElementById('canvas-world');
    const viewport = document.getElementById('viewport');
    let isDragging = false;
    let downPos = { x: 0, y: 0 };

    shopsData.forEach(shop => {
      const node = document.createElement('div');
      node.className = 'shop-node';
      node.dataset.category = shop.category;
      node.style.left = `${shop.x}px`;
      node.style.top = `${shop.y}px`;

      // 1. 枝分かれ線（SVG）
      const svgNS = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(svgNS, "svg");
      svg.setAttribute("class", "connector-svg");
      svg.setAttribute("viewBox", "0 0 1200 1000");

      shop.notes.forEach(note => {
        const line = document.createElementNS(svgNS, "path");
        const x1 = 600, y1 = 500;
        const x2 = 600 + note.offsetX, y2 = 500 + note.offsetY;
        line.setAttribute("class", "connector-line");
        line.setAttribute("d", `M ${x1} ${y1} Q ${x1 + note.offsetX * 0.5} ${y1}, ${x2} ${y2}`);
        svg.appendChild(line);
      });
      node.appendChild(svg);

      // 2. 親カード（ポラロイド風看板写真）
      const pin = document.createElement('div');
      pin.className = 'signboard-pin';
      pin.innerHTML = `
        <div class="photo-box">
          <img src="${shop.photo}" alt="${shop.name}"
               onerror="this.parentElement.innerHTML='<div class=photo-placeholder>📷 ここに看板写真が表示されます<br><small>(${shop.photo})</small></div>'">
        </div>
        <div class="pin-caption">
          <div>
            <div class="pin-category">${shop.categoryLabel}</div>
            <div class="pin-title">${shop.name}</div>
          </div>
          <span class="pin-toggle-badge">分析を見る</span>
        </div>
      `;
      node.appendChild(pin);

      // 3. 子カード（付箋メモ）
      shop.notes.forEach((note, idx) => {
        const leaf = document.createElement('div');
        leaf.className = 'memo-leaf';
        leaf.style.setProperty('--tx', `${note.offsetX}px`);
        leaf.style.setProperty('--ty', `${note.offsetY}px`);
        leaf.style.transitionDelay = `${idx * 0.05}s`;
        leaf.innerHTML = `
          <div class="memo-step">${note.step}</div>
          <div class="memo-heading">${note.title}</div>
          <p class="memo-excerpt">${note.text}</p>
          <div class="memo-readmore">全文を読む →</div>
        `;

        leaf.addEventListener('pointerup', (e) => {
          e.stopPropagation();
          if (isDragging) return;
          openModal(shop, note);
        });

        node.appendChild(leaf);
      });

      // PCはマウスが触れたら展開、スマホはタップで開閉
      pin.addEventListener('pointerenter', (e) => {
        if (e.pointerType === 'mouse' && !isDragging) {
          node.classList.add('is-open');
        }
      });

      pin.addEventListener('pointerup', (e) => {
        e.stopPropagation();
        if (isDragging) return;
        node.classList.toggle('is-open');
      });

      world.appendChild(node);
    });

    // Panzoom 初期化
    const startScale = window.innerWidth < 768 ? 0.6 : 0.92;
    const getCenter = () => ({
      x: window.innerWidth / 2 - 1600 * startScale,
      y: window.innerHeight / 2 - 1600 * startScale
    });

    const pz = Panzoom(world, {
      maxScale: 2.2,
      minScale: 0.4,
      startScale: startScale,
      startX: getCenter().x,
      startY: getCenter().y
    });

    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      pz.zoomWithWheel(e);
    }, { passive: false });

    viewport.addEventListener('pointerdown', (e) => {
      isDragging = false;
      downPos = { x: e.clientX, y: e.clientY };
    });

    viewport.addEventListener('pointermove', (e) => {
      if (Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y) > 5) {
        isDragging = true;
      }
    });

    viewport.addEventListener('pointerup', (e) => {
      if (!isDragging && e.target === world) {
        document.querySelectorAll('.shop-node.is-open').forEach(el => el.classList.remove('is-open'));
      }
      setTimeout(() => { isDragging = false; }, 40);
    });

    // フィルター＆リセット
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const f = btn.dataset.filter;
        document.querySelectorAll('.shop-node').forEach(node => {
          node.classList.toggle('is-filtered-out', f !== 'all' && node.dataset.category !== f);
        });
      });
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      const c = getCenter();
      pz.zoom(startScale, { animate: true });
      pz.pan(c.x, c.y, { animate: true });
    });

    // モーダル制御
    const modal = document.getElementById('modal');
    function openModal(shop, note) {
      document.getElementById('modal-shop').textContent = `${shop.name} ／ ${note.step}`;
      document.getElementById('modal-title').textContent = note.title;
      document.getElementById('modal-body').textContent = note.text;
      document.getElementById('modal-photo-wrap').innerHTML = `
        <img src="${shop.photo}" alt="${shop.name}"
             onerror="this.parentElement.innerHTML='<div class=photo-placeholder>📷 看板写真 (${shop.photo})</div>'">
      `;
      modal.classList.add('is-open');
    }

    document.getElementById('modal-close').addEventListener('click', () => modal.classList.remove('is-open'));
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.remove('is-open');
    });
  </script>
</body>
</html>
