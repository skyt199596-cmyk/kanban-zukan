<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>薩摩川内市 看板デザイン図鑑</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #18191b;
      font-family: 'Shippori Mincho', serif;
      user-select: none;
    }

    /* =========================================
       背景レイヤー（店舗に近づくとふんわり切り替わる）
    ========================================= */
    .bg-layer {
      position: fixed;
      inset: 0;
      background-size: cover;
      background-position: center;
      transition: opacity 0.9s cubic-bezier(0.22, 1, 0.36, 1), transform 1.4s ease;
      pointer-events: none;
      z-index: 0;
    }

    /* 初期のデフォルト背景 */
    #bg-default {
      background-color: #202225;
      background-image: radial-gradient(rgba(255, 255, 255, 0.14) 1px, transparent 1px);
      background-size: 36px 36px;
      opacity: 1;
    }

    /* 店舗ごとの背景（カーソルが近づくとふわっと浮かび上がる） */
    .shop-bg {
      opacity: 0;
      transform: scale(1.05);
      filter: brightness(0.75);
    }

    .shop-bg.is-active {
      opacity: 1;
      transform: scale(1);
    }

    /* =========================================
       左上のタイトルロゴ（控えめに配置）
    ========================================= */
    .site-title {
      position: fixed;
      top: 28px;
      left: 32px;
      z-index: 100;
      color: rgba(255, 255, 255, 0.9);
      font-size: 20px;
      letter-spacing: 0.14em;
      pointer-events: none;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.5);
    }

    .site-hint {
      position: fixed;
      bottom: 24px;
      right: 28px;
      z-index: 100;
      color: rgba(255, 255, 255, 0.55);
      font-size: 12px;
      letter-spacing: 0.08em;
      pointer-events: none;
    }

    /* =========================================
       マウス位置で滑らかにスクロールする空間
    ========================================= */
    #world {
      position: fixed;
      width: 2400px;
      height: 1800px;
      left: 0;
      top: 0;
      z-index: 10;
      will-change: transform;
    }

    /* =========================================
       店舗グループ（枠なし・画像そのものが空間に浮遊）
    ========================================= */
    .shop-spot {
      position: absolute;
      width: 0;
      height: 0;
    }

    /* メインの店舗看板画像 */
    .main-sign-img {
      position: absolute;
      left: 0;
      top: 0;
      transform: translate(-50%, -50%);
      width: 300px;
      height: auto;
      cursor: pointer;
      z-index: 20;
      filter: drop-shadow(0 18px 36px rgba(0, 0, 0, 0.5));
      transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), filter 0.5s ease;
    }

    .shop-spot.is-hovered .main-sign-img {
      transform: translate(-50%, -50%) scale(1.06);
      filter: drop-shadow(0 26px 50px rgba(0, 0, 0, 0.65));
    }

    /* =========================================
       生徒制作の図鑑トピック画像（線なし・連続ポップアップ）
    ========================================= */
    .topic-img {
      position: absolute;
      left: 0;
      top: 0;
      width: 240px;
      height: auto;
      pointer-events: none;
      z-index: 15;
      opacity: 0;
      /* 最初は中心に小さく隠れている */
      transform: translate(-50%, -50%) scale(0.72);
      filter: drop-shadow(0 14px 28px rgba(0, 0, 0, 0.45));
      transition:
        transform 0.65s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.45s ease;
    }

    /* ホバー時：指定座標へ時間差で連続してふわっとポップアップ */
    .shop-spot.is-hovered .topic-img {
      opacity: 1;
      pointer-events: auto;
      transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1);
    }

    /* 個別のトピック画像に触れると少し大きく表示 */
    .shop-spot.is-hovered .topic-img:hover {
      transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.12);
      z-index: 30;
    }
  </style>
</head>
<body>

  <!-- 背景レイヤー -->
  <div id="bg-default" class="bg-layer"></div>
  <div id="bg-container"></div>

  <h1 class="site-title">薩摩川内市 看板デザイン図鑑</h1>
  <div class="site-hint">マウスを動かして探索 ／ 看板に触れると図鑑が展開</div>

  <!-- マウス位置に連動して動く広大な空間 -->
  <div id="world"></div>

  <script>
    /**
     * =========================================================================
     * 【仮画像ジェネレーター】
     * 本番の画像ができるまでの間、見た目と動きを確認するための仮画像を自動生成します。
     * =========================================================================
     */
    function createDummySign(title, subtitle, bgColor, accentColor) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360">
        <rect x="16" y="16" width="568" height="328" rx="28" fill="${bgColor}" stroke="${accentColor}" stroke-width="6"/>
        <rect x="34" y="34" width="532" height="292" rx="18" fill="none" stroke="${accentColor}" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6"/>
        <text x="300" y="135" fill="${accentColor}" font-family="serif" font-size="22" letter-spacing="6" text-anchor="middle">${subtitle}</text>
        <text x="300" y="205" fill="#F7F5F0" font-family="serif" font-weight="bold" font-size="44" letter-spacing="4" text-anchor="middle">${title}</text>
        <text x="300" y="275" fill="#F7F5F0" opacity="0.55" font-family="sans-serif" font-size="16" text-anchor="middle">※ 仮の看板画像（images/ 内の画像に差し替え可能）</text>
      </svg>`;
      return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
    }

    function createDummyTopic(num, heading, subtext, badgeColor) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320">
        <rect x="8" y="8" width="464" height="304" rx="20" fill="#F7F5F0" stroke="#222" stroke-width="3"/>
        <rect x="28" y="28" width="96" height="32" rx="16" fill="${badgeColor}"/>
        <text x="76" y="49" fill="#FFF" font-family="sans-serif" font-weight="bold" font-size="15" text-anchor="middle">TOPIC ${num}</text>
        <text x="28" y="102" fill="#1E1E1E" font-family="serif" font-weight="bold" font-size="28">${heading}</text>
        <line x1="28" y1="122" x2="452" y2="122" stroke="#1E1E1E" stroke-width="2" opacity="0.2"/>
        <rect x="28" y="142" width="424" height="105" rx="12" fill="#EAE6DC"/>
        <text x="240" y="192" fill="#666" font-family="sans-serif" font-size="16" text-anchor="middle">${subtext}</text>
        <text x="240" y="218" fill="#888" font-family="sans-serif" font-size="13" text-anchor="middle">（生徒制作の図鑑画像が入ります）</text>
        <text x="448" y="288" fill="#888" font-family="sans-serif" font-size="13" text-anchor="end">SATSUMASENDAI ARCHIVE</text>
      </svg>`;
      return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
    }

    function createDummyBg(color1, color2, label) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
        <defs>
          <radialGradient id="g" cx="50%" cy="50%" r="70%">
            <stop offset="0%" stop-color="${color1}"/>
            <stop offset="100%" stop-color="${color2}"/>
          </radialGradient>
        </defs>
        <rect width="1600" height="900" fill="url(#g)"/>
        <circle cx="800" cy="450" r="360" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.08"/>
        <circle cx="800" cy="450" r="540" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.05"/>
        <text x="800" y="840" fill="#FFFFFF" opacity="0.2" font-family="serif" font-size="22" letter-spacing="10" text-anchor="middle">${label}</text>
      </svg>`;
      return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
    }

    /**
     * =========================================================================
     * 【ここを書き換えるだけで本番画像に差し替えできます！】
     * 今は createDummy...() で仮画像を表示しています。
     * 画像が完成したら、"images/en.png" のようにファイル名に書き換えるだけです。
     * =========================================================================
     */
    const shops = [
      {
        id: "ensemble",
        // 空間内の配置位置（中央付近は x: 1200, y: 900）
        x: 1200,
        y: 900,

        // ▼ 1. 店舗の看板画像（完成したら "images/en.png" に差し替え）
        signImage: createDummySign("Ensemble", "DRINK × CAFE", "#2F3A40", "#E2A83E"),

        // ▼ 2. カーソルが近づいたときの背景画像（完成したら "images/bg_ensemble.jpg" に差し替え）
        bgImage: createDummyBg("#4A3B32", "#1D1815", "BACKGROUND : ENSEMBLE CAFE ATMOSPHERE"),

        // ▼ 3. 生徒制作の図鑑トピック画像（順番に連続してポップアップします）
        topics: [
          {
            // 完成したら "images/zentai.png" に差し替え
            image: createDummyTopic("01", "全体のまとまりの良さ", "文字の流れと全体のシルエット分析図", "#C83E2B"),
            offsetX: -330,
            offsetY: -190,
            width: 245
          },
          {
            // 完成したら "images/osamari.png" に差し替え
            image: createDummyTopic("02", "おさまりが生む愛おしさ", "曲線ラインと文字の止めの調和図解", "#D98A2B"),
            offsetX: 330,
            offsetY: -180,
            width: 245
          },
          {
            // 完成したら "images/kasukana.png" に差し替え
            image: createDummyTopic("03", "かすかな安定感", "微妙に異なる文字間隔と密度の比較図", "#2E6F73"),
            offsetX: -320,
            offsetY: 200,
            width: 245
          },
          {
            // 完成したら "images/irekae.png" に差し替え
            image: createDummyTopic("04", "入れ替えてみました（Ee / be）", "文字パーツ入れ替え検証シミュレーション", "#5D4E7B"),
            offsetX: 320,
            offsetY: 210,
            width: 245
          }
        ]
      },

      // ▼ 2店舗目のサンプル（空間をスクロールしたときに他の店舗も見つかるイメージ用）
      {
        id: "sample-shop-2",
        x: 1850,
        y: 720,
        signImage: createDummySign("川内 昔ながらの和菓子舗", "TRADITIONAL SWEETS", "#4A2525", "#E8C574"),
        bgImage: createDummyBg("#522A28", "#1F1212", "BACKGROUND : RETRO SHOP STREET"),
        topics: [
          {
            image: createDummyTopic("01", "手書き毛筆の力強さ", "筆の入りと抜きのリズム分析", "#C83E2B"),
            offsetX: -300,
            offsetY: -170,
            width: 235
          },
          {
            image: createDummyTopic("02", "経年変化と木の質感", "看板の素材と色味のコントラスト", "#D98A2B"),
            offsetX: 300,
            offsetY: -160,
            width: 235
          },
          {
            image: createDummyTopic("03", "縦書きの余白バランス", "視線を誘導する文字配置の工夫", "#2E6F73"),
            offsetX: 290,
            offsetY: 180,
            width: 235
          }
        ]
      }
    ];

    /**
     * =========================================================================
     * 画面生成とインタラクション（マウス移動＆ホバーのみで動作）
     * =========================================================================
     */
    const world = document.getElementById('world');
    const bgContainer = document.getElementById('bg-container');
    const WORLD_W = 2400;
    const WORLD_H = 1800;

    const shopElements = shops.map(shop => {
      // 1. 背景画像レイヤー
      const bgDiv = document.createElement('div');
      bgDiv.className = 'bg-layer shop-bg';
      bgDiv.style.backgroundImage = `url("${shop.bgImage}")`;
      bgContainer.appendChild(bgDiv);

      // 2. 店舗スポット
      const spot = document.createElement('div');
      spot.className = 'shop-spot';
      spot.style.left = `${shop.x}px`;
      spot.style.top = `${shop.y}px`;

      // 3. 生徒制作のトピック画像（時間差で連続ポップアップ）
      shop.topics.forEach((topic, index) => {
        const tImg = document.createElement('img');
        tImg.className = 'topic-img';
        tImg.src = topic.image;
        tImg.alt = '';
        if (topic.width) tImg.style.width = `${topic.width}px`;
        tImg.style.setProperty('--tx', `${topic.offsetX}px`);
        tImg.style.setProperty('--ty', `${topic.offsetY}px`);
        // 0.13秒ずつ遅れて連続的にふわっと出現させる
        tImg.dataset.delay = `${index * 0.13}s`;
        spot.appendChild(tImg);
      });

      // 4. 店舗看板画像（メイン）
      const signImg = document.createElement('img');
      signImg.className = 'main-sign-img';
      signImg.src = shop.signImage;
      signImg.alt = '';
      spot.appendChild(signImg);

      // カーソルが店舗画像に触れたとき
      signImg.addEventListener('mouseenter', () => {
        spot.classList.add('is-hovered');
        spot.querySelectorAll('.topic-img').forEach(img => {
          img.style.transitionDelay = img.dataset.delay;
        });
      });

      // カーソルが店舗グループから離れたら閉じる
      spot.addEventListener('mouseleave', () => {
        spot.classList.remove('is-hovered');
        spot.querySelectorAll('.topic-img').forEach(img => {
          img.style.transitionDelay = '0s';
        });
      });

      world.appendChild(spot);
      return { shop, spot, bgDiv };
    });

    /**
     * =========================================================================
     * マウスポインタ位置に応じた滑らかな空間スクロール ＆ 接近時の背景切り替え
     * =========================================================================
     */
    let mouseRatioX = 0.5;
    let mouseRatioY = 0.5;
    let currentX = (window.innerWidth - WORLD_W) / 2;
    let currentY = (window.innerHeight - WORLD_H) / 2;
    let pointerClientX = window.innerWidth / 2;
    let pointerClientY = window.innerHeight / 2;

    window.addEventListener('mousemove', (e) => {
      pointerClientX = e.clientX;
      pointerClientY = e.clientY;
      mouseRatioX = e.clientX / window.innerWidth;
      mouseRatioY = e.clientY / window.innerHeight;
    });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        const t = e.touches[0];
        pointerClientX = t.clientX;
        pointerClientY = t.clientY;
        mouseRatioX = t.clientX / window.innerWidth;
        mouseRatioY = t.clientY / window.innerHeight;
      }
    }, { passive: true });

    function animate() {
      const maxScrollX = Math.max(0, WORLD_W - window.innerWidth);
      const maxScrollY = Math.max(0, WORLD_H - window.innerHeight);

      const targetX = -maxScrollX * mouseRatioX;
      const targetY = -maxScrollY * mouseRatioY;

      // クリック不要・マウス位置に合わせて滑らかに追従
      currentX += (targetX - currentX) * 0.06;
      currentY += (targetY - currentY) * 0.06;

      world.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;

      // 店舗への接近判定（480px以内に近づくと背景がふんわり切り替わる）
      const APPROACH_RADIUS = 480;
      let closestItem = null;
      let minDistance = Infinity;

      shopElements.forEach(item => {
        const screenShopX = currentX + item.shop.x;
        const screenShopY = currentY + item.shop.y;
        const dist = Math.hypot(pointerClientX - screenShopX, pointerClientY - screenShopY);

        if (dist < APPROACH_RADIUS && dist < minDistance) {
          minDistance = dist;
          closestItem = item;
        }
      });

      shopElements.forEach(item => {
        if (item === closestItem) {
          item.bgDiv.classList.add('is-active');
        } else {
          item.bgDiv.classList.remove('is-active');
        }
      });

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
